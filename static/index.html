<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EvalRAG</title>
  <style>
    body {
      font-family: Georgia, serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 20px;
      color: #222;
      background: #fdfdfb;
    }
    h1 {
      margin-bottom: 4px;
    }
    .subtitle {
      color: #666;
      margin-top: 0;
      margin-bottom: 28px;
    }
    .examples button {
      font-family: inherit;
      font-size: 14px;
      background: #f0efe9;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 6px 10px;
      margin: 0 6px 6px 0;
      cursor: pointer;
    }
    .examples button:hover {
      background: #e6e4da;
    }
    .ask-row {
      display: flex;
      gap: 8px;
      margin: 16px 0 24px;
    }
    #question {
      flex: 1;
      font-family: inherit;
      font-size: 16px;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 4px;
    }
    #ask-btn {
      font-family: inherit;
      font-size: 16px;
      padding: 10px 18px;
      background: #2c3e50;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #ask-btn:disabled {
      background: #999;
    }
    #answer {
      white-space: pre-wrap;
      line-height: 1.55;
      background: #fff;
      border: 1px solid #e2e2dc;
      border-radius: 4px;
      padding: 16px;
      min-height: 40px;
    }
    .source {
      font-size: 14px;
      color: #555;
      border-left: 3px solid #ccc;
      padding: 8px 12px;
      margin: 10px 0;
      background: #f8f8f4;
    }
    .source b {
      color: #2c3e50;
    }
    h3 {
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <h1>EvalRAG</h1>
  <p class="subtitle">Ask questions about SEC 10-K filings. Answers come with sources.</p>

  <div class="examples">
    <button onclick="fill(this)">What are Apple's main product categories?</button>
    <button onclick="fill(this)">What supply chain risks does NVIDIA mention?</button>
    <button onclick="fill(this)">What are Microsoft's business segments?</button>
  </div>

  <div class="ask-row">
    <input id="question" placeholder="Ask something about the filings..."
           onkeydown="if (event.key === 'Enter') askQuestion()">
    <button id="ask-btn" onclick="askQuestion()">Ask</button>
  </div>

  <div id="answer">Ask a question to get started.</div>
  <div id="sources"></div>

  <script>
    function fill(btn) {
      document.getElementById("question").value = btn.textContent;
      askQuestion();
    }

    async function askQuestion() {
      const question = document.getElementById("question").value.trim();
      if (!question) return;

      const btn = document.getElementById("ask-btn");
      const answerBox = document.getElementById("answer");
      const sourcesBox = document.getElementById("sources");

      btn.disabled = true;
      answerBox.textContent = "Thinking...";
      sourcesBox.innerHTML = "";

      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question }),
        });
        const data = await res.json();

        answerBox.textContent = data.answer;

        if (data.sources && data.sources.length > 0) {
          sourcesBox.innerHTML = "<h3>Sources</h3>";
          for (const s of data.sources) {
            const div = document.createElement("div");
            div.className = "source";
            div.innerHTML = "<b>" + s.ticker + " 10-K (FY" + s.fiscal_year + ")</b><br>";
            div.append(s.text + "...");
            sourcesBox.appendChild(div);
          }
        }
      } catch (err) {
        answerBox.textContent = "Something went wrong: " + err;
      }

      btn.disabled = false;
    }
  </script>
</body>
</html>
